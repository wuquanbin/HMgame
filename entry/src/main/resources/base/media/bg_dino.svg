<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9c74f"/>
      <stop offset="60%" stop-color="#f8961e"/>
      <stop offset="100%" stop-color="#f3722c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5e3023"/>
      <stop offset="100%" stop-color="#2d1b13"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#sky)"/>
  <!-- 远山 -->
  <polygon points="0,120 60,70 120,110 180,60 240,105 300,75 360,115 400,95 400,180 0,180" fill="#6b3f2c" opacity="0.6"/>
  <!-- 地面 -->
  <rect x="0" y="140" width="400" height="40" fill="url(#ground)"/>
  <!-- 仙人掌 -->
  <g fill="#3a5a40" stroke="#2d4a34" stroke-width="2">
    <rect x="220" y="100" width="18" height="48" rx="8"/>
    <rect x="238" y="115" width="12" height="20" rx="5"/>
    <rect x="202" y="120" width="12" height="16" rx="5"/>
    <rect x="310" y="115" width="15" height="35" rx="7"/>
    <rect x="325" y="125" width="10" height="15" rx="5"/>
  </g>
  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="70" cy="35" rx="25" ry="10"/>
    <ellipse cx="85" cy="30" rx="18" ry="8"/>
    <ellipse cx="55" cy="32" rx="15" ry="7"/>
    <ellipse cx="180" cy="25" rx="20" ry="8"/>
    <ellipse cx="195" cy="22" rx="14" ry="6"/>
    <ellipse cx="320" cy="40" rx="18" ry="7"/>
  </g>
  <!-- 小恐龙 -->
  <g>
    <!-- 身体 -->
    <path d="M50 120 Q50 95 80 95 L105 95 Q115 95 115 105 L115 120 L110 125 L100 125 L100 135 L95 138 L88 138 L85 130 L70 130 L65 138 L58 138 L55 130 L50 130 Z" fill="#4a5d23" stroke="#2d3a14" stroke-width="2"/>
    <!-- 头部 -->
    <circle cx="110" cy="95" r="18" fill="#4a5d23" stroke="#2d3a14" stroke-width="2"/>
    <!-- 眼睛 -->
    <circle cx="115" cy="88" r="4" fill="#ffffff"/>
    <circle cx="116" cy="88" r="2" fill="#1a1a1a"/>
    <!-- 嘴 -->
    <path d="M120 100 Q125 102 128 98" stroke="#2d3a14" stroke-width="2" fill="none"/>
    <!-- 纹理 -->
    <circle cx="90" cy="110" r="3" fill="#3a4d1c"/>
    <circle cx="75" cy="112" r="3" fill="#3a4d1c"/>
    <circle cx="100" cy="115" r="3" fill="#3a4d1c"/>
  </g>
  <!-- 障碍物 -->
  <g>
    <rect x="280" y="118" width="16" height="22" fill="#2d3a14" stroke="#1a2108" stroke-width="1" rx="4"/>
    <rect x="284" y="118" width="4" height="22" fill="#2d3a14" rx="4"/>
    <rect x="350" y="128" width="12" height="12" fill="#3a4d1c" stroke="#2d3a14" stroke-width="1" rx="4"/>
  </g>
  <!-- 分数点 -->
  <circle cx="150" cy="65" r="4" fill="#ffe066"/>
  <circle cx="200" cy="55" r="3" fill="#ffe066"/>
  <circle cx="250" cy="45" r="3" fill="#ffe066"/>
</svg>
