<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#1a2a4f"/>
      <stop offset="100%" stop-color="#2a3f6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#sky)"/>
  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="30" cy="25" r="1.5"/>
    <circle cx="70" cy="15" r="1"/>
    <circle cx="110" cy="35" r="1.5"/>
    <circle cx="150" cy="20" r="1"/>
    <circle cx="190" cy="30" r="1.2"/>
    <circle cx="230" cy="15" r="1.5"/>
    <circle cx="270" cy="28" r="1"/>
    <circle cx="310" cy="20" r="1.3"/>
    <circle cx="350" cy="32" r="1.2"/>
    <circle cx="380" cy="18" r="1"/>
    <circle cx="50" cy="55" r="1.5"/>
    <circle cx="90" cy="70" r="1"/>
    <circle cx="130" cy="60" r="1.2"/>
    <circle cx="170" cy="75" r="1"/>
    <circle cx="210" cy="50" r="1.4"/>
    <circle cx="250" cy="65" r="1"/>
    <circle cx="290" cy="55" r="1.3"/>
    <circle cx="330" cy="72" r="1"/>
    <circle cx="370" cy="60" r="1.2"/>
  </g>
  <!-- 战斗机 -->
  <g>
    <!-- 机身 -->
    <polygon points="90,95 70,115 70,130 90,135 110,130 110,115" fill="#e8e8e8" stroke="#888888" stroke-width="1.5"/>
    <!-- 机头 -->
    <polygon points="100,95 130,115 130,130 100,135" fill="#c0c0c0" stroke="#707070" stroke-width="1.5"/>
    <polygon points="125,118 140,122 140,123 125,127" fill="#505050"/>
    <!-- 机翼 -->
    <polygon points="55,118 90,118 90,132 30,140" fill="#a0a0a0" stroke="#707070" stroke-width="1.5"/>
    <polygon points="55,118 90,118 90,132 30,140" fill="#a0a0a0" stroke="#707070" stroke-width="1.5"/>
    <!-- 尾翼 -->
    <polygon points="70,115 70,100 78,110 78,115" fill="#b0b0b0" stroke="#707070" stroke-width="1"/>
    <!-- 驾驶舱 -->
    <ellipse cx="95" cy="118" rx="10" ry="6" fill="#4a9eff" stroke="#2a5eb0" stroke-width="1"/>
    <!-- 尾部火焰 -->
    <polygon points="60,120 45,115 40,122 45,129 60,125" fill="url(#glow)"/>
    <polygon points="48,122 35,118 30,122 35,126 48,125" fill="#ff9f40" opacity="0.9"/>
  </g>
  <!-- 敌机 -->
  <g opacity="0.9">
    <polygon points="280,35 270,45 270,55 280,58 290,55 290,45" fill="#8b1a1a" stroke="#4a0a0a" stroke-width="1.5"/>
    <polygon points="275,32 295,42 295,55 275,58" fill="#a52a2a" stroke="#4a0a0a" stroke-width="1.5"/>
    <polygon points="295,45 320,48 320,52 295,52" fill="#6b1010"/>
    <ellipse cx="282" cy="48" rx="5" ry="3" fill="#ff4444"/>
    <!-- 尾部烟 -->
    <circle cx="265" cy="50" r="5" fill="#aaaaaa" opacity="0.7"/>
    <circle cx="258" cy="52" r="4" fill="#999999" opacity="0.6"/>
    <circle cx="250" cy="53" r="3" fill="#888888" opacity="0.5"/>
  </g>
  <g opacity="0.85">
    <polygon points="330,140 322,150 322,160 330,163 338,160 338,150" fill="#8b1a1a" stroke="#4a0a0a" stroke-width="1.5"/>
    <polygon points="328,137 348,147 348,160 328,163" fill="#a52a2a" stroke="#4a0a0a" stroke-width="1.5"/>
    <ellipse cx="333" cy="153" rx="5" ry="3" fill="#ff4444"/>
  </g>
  <!-- 子弹/激光 -->
  <g>
    <rect x="145" y="118" width="18" height="3" fill="#ffff00" opacity="0.95"/>
    <rect x="145" y="127" width="18" height="3" fill="#ffff00" opacity="0.95"/>
    <rect x="220" y="100" width="12" height="3" fill="#ff4444" opacity="0.9"/>
    <rect x="240" y="80" width="10" height="3" fill="#ff4444" opacity="0.9"/>
    <circle cx="260" cy="95" r="4" fill="#ffdd00" opacity="0.8"/>
    <circle cx="260" cy="95" r="6" fill="#ffdd00" opacity="0.3"/>
  </g>
  <!-- 爆炸效果 -->
  <g opacity="0.8">
    <circle cx="305" cy="105" r="10" fill="#ff6b00"/>
    <circle cx="305" cy="105" r="15" fill="#ff6b00" opacity="0.4"/>
    <circle cx="305" cy="105" r="6" fill="#ffff00"/>
    <path d="M305 95 L308 100 L315 98 L310 105 L318 108 L310 110 L312 118 L305 112 L298 118 L300 110 L292 108 L300 105 L295 98 L302 100 Z" fill="#ffdd00"/>
  </g>
</svg>
